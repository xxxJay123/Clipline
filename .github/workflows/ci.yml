name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Draw the line without a screen
        shell: pwsh
        run: ./scripts/snapshot.ps1 -Out artifacts/snapshot
      - uses: actions/upload-artifact@v5
        with:
          name: snapshot
          path: artifacts/snapshot/*.png
          retention-days: 14

  package:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - runtime: win-x64
            small: false
          - runtime: win-arm64
            small: false
          - runtime: win-x64
            small: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        shell: pwsh
        run: |
          if ('${{ matrix.small }}' -eq 'true') { ./scripts/publish.ps1 -Runtime ${{ matrix.runtime }} -Small }
          else { ./scripts/publish.ps1 -Runtime ${{ matrix.runtime }} }
      - uses: actions/upload-artifact@v5
        with:
          name: Clipline-${{ matrix.runtime }}${{ matrix.small && '-small' || '' }}
          path: artifacts/*.zip*
          retention-days: 30
