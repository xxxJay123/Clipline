name: Release

# Push a tag like v0.1.0 to build every download and publish them as a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Publish
        shell: pwsh
        run: |
          ./scripts/publish.ps1 -Runtime win-x64
          ./scripts/publish.ps1 -Runtime win-arm64
          ./scripts/publish.ps1 -Runtime win-x64 -Small
      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' artifacts/*.zip artifacts/*.sha256 `
            --title 'Clipline ${{ github.ref_name }}' --generate-notes
